<title>Beste Atölyesi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>/* Yerleşim: stüdyo masası — üstte bant sayacı gibi adım şeridi, altta raf kartları, en sonda kâğıt partisyon */
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --surface-2:#F6F8F9; --ink:#15202A; --muted:#5A6773; --line:#D2D9DF;
  --accent:#A26F16; --accent-ink:#FFFFFF; --accent-soft:#F4E8CF; --signal:#2A6A88; --signal-soft:#DCEBF2;
  --danger:#B1382B; --ok:#2C7A4D; --paper:#FFFFFF; --paper-ink:#111111; --shadow:0 1px 2px rgba(21,32,42,.06),0 6px 18px rgba(21,32,42,.05);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1317; --surface:#151C22; --surface-2:#1B242B; --ink:#E5EBEF; --muted:#94A2AE; --line:#27323B;
  --accent:#DCA645; --accent-ink:#1B1304; --accent-soft:#3A2D14; --signal:#72B6D8; --signal-soft:#18303D;
  --danger:#E0705F; --ok:#62C08A; --paper:#FFFFFF; --paper-ink:#111111; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1317; --surface:#151C22; --surface-2:#1B242B; --ink:#E5EBEF; --muted:#94A2AE; --line:#27323B;
  --accent:#DCA645; --accent-ink:#1B1304; --accent-soft:#3A2D14; --signal:#72B6D8; --signal-soft:#18303D;
  --danger:#E0705F; --ok:#62C08A; --paper:#FFFFFF; --paper-ink:#111111; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:650}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.tiny{font-size:.8rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* üst bant */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:-.02em}
.brand b{color:var(--accent);font-weight:800}
.songline{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px}
.step{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 6px;font:inherit;font-size:.82rem;cursor:pointer;display:flex;gap:6px;align-items:center;justify-content:center;min-width:0}
.step .n{font-family:var(--f-mono);font-size:.75rem;width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line);flex:none}
.step .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step[aria-current="step"]{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.step[aria-current="step"] .n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.step:focus-visible,.btn:focus-visible,.chipbtn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
@media (max-width:560px){.step .l{display:none}.step{padding:7px 2px}}

main{padding-block:18px 110px}
.pagehead{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none;background:var(--surface-2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.ctl{display:flex;gap:6px;align-items:center;min-width:0}
.ctl>*:first-child{flex:1;min-width:0}

input[type=text],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.45}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
.check{display:flex;gap:8px;align-items:center;font-size:.92rem;cursor:pointer}

.btn{appearance:none;font:inherit;font-size:.9rem;font-weight:600;border-radius:8px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ai{background:var(--signal-soft);border-color:var(--signal);color:var(--ink)}
.btn.ghost{background:transparent}
.btn.small{padding:5px 9px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:default}
.icon{width:34px;height:34px;padding:0;justify-content:center;flex:none}
.dice{font-family:var(--f-mono);font-size:.85rem}

.chipbtn{appearance:none;font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.chipbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.chipbtn:hover{border-color:var(--muted)}
.tag{font-size:.74rem;border-radius:999px;padding:2px 8px;background:var(--signal-soft);color:var(--ink);border:1px solid transparent}
.tag.warn{background:transparent;border-color:var(--danger);color:var(--danger)}
.status{font-size:.88rem;color:var(--muted);min-height:1.2em}
.status.ok{color:var(--ok)} .status.err{color:var(--danger)}

/* ölçek gösterimi */
.scale{display:flex;flex-wrap:wrap;gap:6px}
.deg{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface-2);min-width:48px}
.deg .r{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.deg .c{font-family:var(--f-mono);font-weight:600}

/* bölüm kartları */
.sec{border-left:4px solid var(--c,var(--line))}
.sechead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.secnum{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);width:22px}
.secname{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.secsub{font-size:.8rem;color:var(--muted)}
.sechead .tools{margin-left:auto;display:flex;gap:4px}
.sylls{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}

/* akor şeridi */
.chords{display:flex;flex-wrap:wrap;gap:6px}
.chord{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);overflow:hidden}
.chord input{width:78px;border:0;background:transparent;font-family:var(--f-mono);font-weight:600;padding:7px 8px;border-radius:0}
.chord select{width:auto;border:0;border-left:1px solid var(--line);border-radius:0;background:transparent;font-family:var(--f-mono);font-size:.8rem;padding:7px 4px}
.chord button{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:0 8px;font-size:1rem;align-self:stretch}
.chord.bad{border-color:var(--danger)}
.progs{display:flex;flex-wrap:wrap;gap:6px}
.prog{appearance:none;font:inherit;text-align:left;border:1px dashed var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.prog:hover{border-style:solid;border-color:var(--accent)}
.prog .pn{font-size:.72rem;color:var(--muted)} .prog .pc{font-family:var(--f-mono);font-size:.84rem;font-weight:600}
details>summary{cursor:pointer;font-weight:600;font-size:.9rem;list-style:none;display:flex;gap:6px;align-items:center}
details>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
details>summary::-webkit-details-marker{display:none}

/* enstrüman */
.insthead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;width:100%;height:100%;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--signal);outline-offset:2px}
.secrows{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.secrow{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.secrow .who{font-weight:600;font-size:.88rem;display:flex;flex-direction:column}
.secrow .who small{font-weight:400;color:var(--muted);font-size:.75rem}
.secrow .what{display:flex;flex-direction:column;gap:6px;min-width:0}
@media (max-width:560px){.secrow{grid-template-columns:1fr;gap:6px}}
.off{opacity:.55}

/* oynatıcı + partisyon */
.transport{position:sticky;top:calc(env(safe-area-inset-top,0px) + 108px);z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
@media (max-width:700px){.transport{position:static}}
.pos{min-width:150px}
.play{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;cursor:pointer;display:grid;place-items:center;flex:none}
.play svg{width:20px;height:20px}
.pos{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.86rem;min-width:0;flex:1}
.pos b{font-family:var(--f-display);font-size:1rem}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.paperwrap{background:var(--paper);color:var(--paper-ink);border-radius:var(--r);border:1px solid var(--line);overflow-x:auto;min-height:220px;position:relative}
#osmd{min-width:340px}
.paperwrap .wait{position:absolute;inset:0;display:grid;place-items:center;color:#555;font-size:.95rem;padding:20px;text-align:center}
.mix{display:grid;grid-template-columns:minmax(90px,140px) 1fr auto auto;gap:8px 10px;align-items:center}
.mix .nm{font-size:.86rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.regen{display:grid;grid-template-columns:minmax(90px,140px) minmax(0,1fr) auto;gap:8px 10px;align-items:center}
.regen .locks{display:flex;flex-wrap:wrap;gap:4px}
@media (max-width:560px){.regen{grid-template-columns:1fr auto}.regen .locks{grid-column:1/-1;order:3}}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}

/* alt gezinme */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px}
.nav .hint{font-size:.8rem;color:var(--muted);text-align:center;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.88rem;z-index:40;max-width:min(92vw,520px);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<header class="top"><div class="wrap"><div class="brandrow"><span class="brand">Beste <b>Atölyesi</b></span><span class="songline" id="songline"></span></div><nav class="steps" id="steps" aria-label="Adımlar"></nav></div></header>
<main class="wrap" id="page"></main>
<div class="nav"><div class="wrap"><button id="prev" class="btn" type="button">Geri</button><span class="hint" id="navhint"></span><button id="next" class="btn primary" type="button">İleri</button></div></div>
<script>// ================= BESTE ATÖLYESİ — MÜZİK MOTORU =================
// Tüm zamanlar 16'lık nota biriminde (1 = 16'lık, 4 = dörtlük).
const ENG = (() => {
'use strict';

// ---------- yardımcılar ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(const c of String(s)){h^=c.codePointAt(0);h=Math.imul(h,16777619);}return h>>>0;}
const pick=(rng,arr)=>arr[Math.floor(rng()*arr.length)%arr.length];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mod=(n,m)=>((n%m)+m)%m;
const xmlEsc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// ---------- teori ----------
const LETTERS=['C','D','E','F','G','A','B'];
const LETTER_PC=[0,2,4,5,7,9,11];
const TONICS=['C','C#','Db','D','Eb','E','F','F#','Gb','G','Ab','A','Bb','B'];
const NAME_PC={C:0,'B#':0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,Fb:4,'E#':5,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11,Cb:11};
const SOLFEJ={do:'C',re:'D',mi:'E',fa:'F',sol:'G',la:'A',si:'B'};
const MODES={
  ionian:    {tr:'Majör (İyonyen)', iv:[0,2,4,5,7,9,11], deg:0, off:0,  minor:false, xml:'major'},
  lydian:    {tr:'Lidyen',          iv:[0,2,4,6,7,9,11], deg:3, off:5,  minor:false, xml:'lydian'},
  mixolydian:{tr:'Miksolidyen',     iv:[0,2,4,5,7,9,10], deg:4, off:7,  minor:false, xml:'mixolydian'},
  dorian:    {tr:'Doryen',          iv:[0,2,3,5,7,9,10], deg:1, off:2,  minor:true,  xml:'dorian'},
  aeolian:   {tr:'Minör (Eolyen)',  iv:[0,2,3,5,7,8,10], deg:5, off:9,  minor:true,  xml:'minor'},
  phrygian:  {tr:'Frigyen',         iv:[0,1,3,5,7,8,10], deg:2, off:4,  minor:true,  xml:'phrygian'},
  locrian:   {tr:'Lokriyen',        iv:[0,1,3,5,6,8,10], deg:6, off:11, minor:true,  xml:'locrian'},
  harmonic:  {tr:'Armonik Minör',   iv:[0,2,3,5,7,8,11], deg:5, off:9,  minor:true,  xml:'minor'},
  melodic:   {tr:'Melodik Minör',   iv:[0,2,3,5,7,9,11], deg:5, off:9,  minor:true,  xml:'minor'},
  hicaz:     {tr:'Hicaz (Frigyen Dominant)', iv:[0,1,4,5,7,8,10], deg:2, off:4, minor:false, xml:'phrygian'},
};
const PARENT_FIFTHS={0:0,7:1,2:2,9:3,4:4,11:5,6:6,1:-5,8:-4,3:-3,10:-2,5:-1};

function scaleFrom(fifths,modeKey,tonicPc){
  const m=MODES[modeKey]; const parentLetter=mod(fifths*4,7); const tl=(parentLetter+m.deg)%7;
  return m.iv.map((iv,i)=>{const letter=(tl+i)%7;const pc=mod(tonicPc+iv,12);let alter=pc-LETTER_PC[letter];if(alter>6)alter-=12;if(alter<-6)alter+=12;return{letter,alter,pc};});
}
function keyFifths(tonic,modeKey){
  const m=MODES[modeKey]; const t=NAME_PC[tonic]; const f=PARENT_FIFTHS[mod(t-m.off,12)];
  for(const c of [f,f-12,f+12]){ if(c<-7||c>7)continue; if(LETTERS[scaleFrom(c,modeKey,t)[0].letter]===tonic[0])return c; }
  return f;
}
function makeSpeller(scale,fifths){
  const map={}; scale.forEach(s=>{if(!map[s.pc])map[s.pc]=s;});
  return pc=>{pc=mod(pc,12); if(map[pc])return map[pc];
    const sharp=fifths>=0;
    const up=scale.find(s=>mod(s.pc+1,12)===pc&&s.alter<2), dn=scale.find(s=>mod(s.pc-1,12)===pc&&s.alter>-2);
    if(sharp&&up)return{letter:up.letter,alter:up.alter+1,pc};
    if(!sharp&&dn)return{letter:dn.letter,alter:dn.alter-1,pc};
    if(up)return{letter:up.letter,alter:up.alter+1,pc};
    if(dn)return{letter:dn.letter,alter:dn.alter-1,pc};
    const nat=LETTER_PC.indexOf(pc); if(nat>=0)return{letter:nat,alter:0,pc};
    const l=LETTER_PC.indexOf(mod(pc-1,12)); return{letter:l,alter:1,pc};
  };
}
function spellMidi(midi,sp){const s=sp(midi);const oct=Math.floor((midi-s.alter-LETTER_PC[s.letter])/12)-1;return{step:LETTERS[s.letter],alter:s.alter,octave:oct};}
function noteName(pc,sp){const s=sp(pc);return LETTERS[s.letter]+(s.alter>0?'#'.repeat(s.alter):'b'.repeat(-s.alter));}
function keyInfo(tonic,modeKey){const f=keyFifths(tonic,modeKey);const tp=NAME_PC[tonic];const scale=scaleFrom(f,modeKey,tp);return{fifths:f,tonicPc:tp,mode:modeKey,scale,pcs:scale.map(s=>s.pc),sp:makeSpeller(scale,f)};}

// ---------- akorlar ----------
// [son ek, aralıklar, musicxml kind, ek dereceler]
const CHORD_TYPES=[
  ['maj9',[0,4,7,11,14],'major-ninth'],['maj7',[0,4,7,11],'major-seventh'],['M7',[0,4,7,11],'major-seventh'],['Δ7',[0,4,7,11],'major-seventh'],['Δ',[0,4,7,11],'major-seventh'],
  ['mMaj7',[0,3,7,11],'major-minor'],['m7b5',[0,3,6,10],'half-diminished'],['ø7',[0,3,6,10],'half-diminished'],['ø',[0,3,6,10],'half-diminished'],
  ['dim7',[0,3,6,9],'diminished-seventh'],['°7',[0,3,6,9],'diminished-seventh'],['dim',[0,3,6],'diminished'],['°',[0,3,6],'diminished'],
  ['madd9',[0,3,7,14],'minor',[[9,0]]],['m11',[0,3,7,10,14,17],'minor-11th'],['m9',[0,3,7,10,14],'minor-ninth'],['m7',[0,3,7,10],'minor-seventh'],['m6',[0,3,7,9],'minor-sixth'],
  ['min7',[0,3,7,10],'minor-seventh'],['min',[0,3,7],'minor'],['-7',[0,3,7,10],'minor-seventh'],['m',[0,3,7],'minor'],['-',[0,3,7],'minor'],
  ['7sus4',[0,5,7,10],'suspended-fourth',[[7,-1]]],['sus4',[0,5,7],'suspended-fourth'],['sus2',[0,2,7],'suspended-second'],['sus',[0,5,7],'suspended-fourth'],

  else if(n===7)groups=[4,4,6];

const TR_V='aeıioöuüâîûAEIİOÖUÜÂÎÛ';
function syllabifyWord(w,lang){
  if(w.includes('-'))return w.split('-').filter(Boolean);
  const isV=c=>lang==='en'?/[aeiouyAEIOUY]/.test(c):TR_V.includes(c);

  for(let i=0;i<letters.length;i++){ if(isV(letters[i])){ if(lang==='en'&&vIdx.length&&vIdx[vIdx.length-1]===i-1){continue;} vIdx.push(i);} }
  if(lang==='en'&&vIdx.length>1&&/[eE]$/.test(w)&&vIdx[vIdx.length-1]===letters.length-1&&!/[lL]e$/.test(w))vIdx.pop();

    const cons=b-a; cuts.push(cons<=1?a:b-1);

}

function nearestOct(pc,target,lo,hi){let best=null,bd=1e9;for(let m=lo;m<=hi;m++){if(mod(m,12)!==pc)continue;const d=Math.abs(m-target);if(d<bd){bd=d;best=m;}}return best??(target-mod(target-pc,12));}

  let pcs=ch.pcs.slice(); if(pcs.length>count){ // 5'i at
    const f=mod(ch.rootPc+7,12); if(pcs.length>count&&pcs.includes(f))pcs.splice(pcs.indexOf(f),1);
    pcs=pcs.slice(0,count);}
  const cands=[];
  for(let r=0;r<pcs.length;r++){const order=pcs.slice(r).concat(pcs.slice(0,r));
    for(let start=low;start<low+12;start++){if(mod(start,12)!==order[0])continue;const v=[start];for(let i=1;i<order.length;i++){let n=v[i-1]+1;while(mod(n,12)!==order[i])n++;v.push(n);}if(v[v.length-1]<=high)cands.push(v);}}
  if(!cands.length){const v=[];pcs.forEach(p=>v.push(nearestOct(p,(low+high)/2,low,high)));return v.sort((a,b)=>a-b);}
  if(!prev||!prev.length){const mid=(low+high)/2;cands.sort((a,b)=>Math.abs(avg(a)-mid)-Math.abs(avg(b)-mid));return cands[0];}
  cands.sort((a,b)=>dist(a,prev)-dist(b,prev));return cands[0];
}
const avg=a=>a.reduce((s,x)=>s+x,0)/a.length;

function sectionList(state){

    const tonic=def.tonic||state.tonic, modeKey=def.mode||state.mode, ts=def.ts||state.ts, tempo=+def.tempo||+state.tempo;
    const key=keyInfo(tonic,modeKey); const mt=meter(ts);
    const chords=[]; let t=0; const rep=Math.max(1,+def.rep||1);
    for(let r=0;r<rep;r++)for(const c of def.chords){const ch=parseChord(c.s)||parseChord(diatonicChord(key,1,false));const d=Math.max(1,Math.round(c.d*mt.len*(c.d<1?1:1)));chords.push({t,dur:Math.round(c.d*mt.len),ch});t+=Math.round(c.d*mt.len);}

    const M=Math.max(1,Math.ceil(t/mt.len));

    out.push({idx,type:it.type,num:counts[it.type],name:it.type+(state.arr.filter(a=>a.type===it.type).length>1?' '+counts[it.type]:''),vary:!!it.vary,lyrics:it.lyrics||'',def,key,mt,tempo,M,S:M*mt.len,chords,dyn:def.dyn||SECTION_DYN[it.type]||'mf'});

}

function phraseRhythm(k,span,beat,density,rng,strongs){

  if(left>=4&&rng()<.35){start=rng()<.5?2:Math.min(4,beat);left-=start;}

  let give=Math.min(left,Math.max(unit,Math.floor(left*.45)));d[n-1]+=give;left-=give;
  const step=unit>=2?2:1; let guard=0;
  while(left>=step&&guard++<500){const i=Math.floor(rng()*n);d[i]+=step;left-=step;}
  d[n-1]+=left;
  const pos=[];let p=start;for(const x of d){pos.push(p);p+=x;}
  return{pos,dur:d,n};
}

      const vel=DYN_VEL[lastSec.dyn]||.9;

      else if(inst==='guitar')events[inst].push({t:T,dur:lm.len,p:guitarVoicing(lastChord,45,false),vel,fer:1});

function playDrum(k,dest,t,vel){
  const ctx=PLAY.ctx;const out=ctx.createGain();out.connect(dest);
  const noise=(dur,type,fr,q,gain,decay)=>{const n=ctx.createBufferSource();n.buffer=PLAY.noise;const f=ctx.createBiquadFilter();f.type=type;f.frequency.value=fr;f.Q.value=q||.7;const g=ctx.createGain();g.gain.setValueAtTime(gain*vel,t);g.gain.exponentialRampToValueAtTime(.001,t+decay);n.connect(f);f.connect(g);g.connect(out);n.start(t,Math.random()*1.5);n.stop(t+decay+.05);};
  const tone=(f0,f1,decay,gain,type)=>{const o=ctx.createOscillator();o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+decay*.6);const g=ctx.createGain();g.gain.setValueAtTime(gain*vel,t);g.gain.exponentialRampToValueAtTime(.001,t+decay);o.connect(g);g.connect(out);o.start(t);o.stop(t+decay+.05);};
  switch(k){
    case 'k':tone(140,42,.42,.95);noise(.02,'highpass',2500,.7,.15,.02);break;
    case 's':case 'g':noise(.2,'highpass',1200,.7,.5,.2);tone(220,170,.12,.35,'triangle');break;
    case 'x':noise(.05,'bandpass',2200,2,.5,.05);tone(500,420,.04,.25,'square');break;
    case 'h':noise(.05,'highpass',7500,.7,.22,.05);break;
    case 'p':noise(.04,'highpass',6500,.7,.12,.04);break;
    case 'o':noise(.3,'highpass',7000,.7,.2,.32);break;
    case 'c':noise(1.6,'highpass',4500,.6,.32,1.6);break;
    case 'r':noise(.7,'bandpass',8000,1.2,.2,.7);tone(3200,3100,.5,.03,'sine');break;
    case 't':tone(240,170,.32,.6);break;
    case 'm':tone(180,125,.36,.6);break;
    case 'f':tone(120,80,.45,.65);break;
  }
}
function scheduler(){
  const ctx=PLAY.ctx,ev=song.play.events,ahead=ctx.currentTime+.2;
  while(PLAY.i<ev.length){const e=ev[PLAY.i];const at=PLAY.t0+e.time/PLAY.rate;if(at>ahead)break;PLAY.i++;if(at<ctx.currentTime-.02)continue;
    const m=PLAY.mix[e.part];if(m&&(m.mute||(Object.values(PLAY.mix).some(x=>x.solo)&&!m.solo)))continue;
    const b=bus(e.part);
    if(e.drum)e.d.forEach((k,i)=>playDrum(k,b,at,Math.min(1.2,(e.dv&&e.dv[i]?e.dv[i]/100:1)*e.vel)));
    else (e.p||[]).forEach((n,i)=>playTone(e.synth,b,n,at+(e.synth&&e.synth[0]==='g'&&e.p.length>2?i*.012:0),e.dur/PLAY.rate,e.vel));
  }
  if(PLAY.i>=ev.length&&ctx.currentTime>PLAY.t0+song.play.total/PLAY.rate){stopPlayback();PLAY.pausedM=null;resetCursor();}
}
function tick(){
  if(!PLAY.on)return; const ctx=PLAY.ctx; const tSong=(ctx.currentTime-PLAY.t0)*PLAY.rate;
  const st=song.play.starts; let mi=0; while(mi+1<st.length&&st[mi+1]<=tSong)mi++; PLAY.curM=mi;
  const m=song.measures[mi]; const s16=60/m.tempo/4; const pos16=Math.max(0,(tSong-st[mi])/s16);
  const bar=$('#posBar'),txt=$('#posTxt'),sec=$('#posSec');
  if(bar)bar.style.width=Math.min(100,tSong/song.play.total*100)+'%';
  if(txt)txt.textContent='Ölçü '+(mi+1)+' · '+fmtTime(tSong)+' / '+fmtTime(song.play.total);
  if(sec)sec.textContent=m.secName||'';
  if(tSong>=0)moveCursorTo((m.start+Math.min(pos16,m.len-.001))/16);
  PLAY.raf=requestAnimationFrame(tick);
}
async function startPlayback(fromM){
  if(dirty||!song)buildNow();
  audioInit(); try{await PLAY.ctx.resume();}catch(e){}
  for(const p of song.parts){PLAY.mix[p.id]=PLAY.mix[p.id]||{vol:p.inst==='drums'?.8:.85,mute:false,solo:false};}
  applyMix();
  fromM=E.clamp(fromM||0,0,song.measures.length-1);
  const fromT=song.play.starts[fromM]||0;
  PLAY.t0=PLAY.ctx.currentTime+.12-fromT/PLAY.rate; PLAY.i=song.play.events.findIndex(e=>e.time>=fromT-1e-6); if(PLAY.i<0)PLAY.i=song.play.events.length;
  PLAY.on=true; PLAY.pausedM=null;
  resetCursor(); moveCursorTo(song.measures[fromM].start/16);
  scheduler(); PLAY.timer=setInterval(scheduler,30); PLAY.raf=requestAnimationFrame(tick);
  const b=$('#playBtn'); if(b){b.replaceChildren(playIcon(true));b.setAttribute('aria-label','Duraklat');}
}
function pausePlayback(){const m=PLAY.curM;stopPlayback();PLAY.pausedM=m;}
function stopPlayback(){
  if(!PLAY.on)return; PLAY.on=false; clearInterval(PLAY.timer); cancelAnimationFrame(PLAY.raf);
  // çalan sesleri kes
  if(PLAY.ctx){const old=PLAY.bus;PLAY.bus={};Object.values(old).forEach(g=>{try{g.gain.setTargetAtTime(0,PLAY.ctx.currentTime,.02);setTimeout(()=>g.disconnect(),400);}catch(e){}});}
  const b=$('#playBtn'); if(b){b.replaceChildren(playIcon(false));b.setAttribute('aria-label','Çal');}
}

// ---------- başlat ----------
function boot(){
  $('#prev').addEventListener('click',()=>go(page-1));
  $('#next').addEventListener('click',()=>go(page===5?1:page+1));
  render();
  if(window.claude&&typeof window.claude.use==='function'){
    window.claude.use('sample').then(s=>{if(!s)return;AI.sample=s;['#aiPrompt','#aiNotes'].forEach(q=>{const b=$(q);if(b)b.hidden=false;});}).catch(()=>{});
    window.claude.use('downloads').then(d=>{if(d)AI.downloads=d;}).catch(()=>{});
  }
  // partisyon kütüphanesini önceden ısıt
  setTimeout(()=>{loadOSMD().catch(()=>{});},1500);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
